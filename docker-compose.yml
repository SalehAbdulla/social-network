services:
  real-time-forum:
    # Use 'build' for local development:
    build:
      context: .
      dockerfile: Dockerfile
    # For production deployment on a VPS, comment out 'build' above
    # and uncomment the 'image' line below:
    # image: saabdulla/real-time-forum:latest
    container_name: real-time-forum
    ports:
      - "5174:5174"
    environment:
      - LOG_LEVEL=info
    volumes:
      # Persist the SQLite database so data survives container restarts
      - ./data:/app/pkg/app/repositories
    restart: unless-stopped
