name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

# The definition of done in TODO.md names these checks; this workflow runs exactly
# them so a branch cannot land unverified. It is deliberately conservative: the
# browser smoke suite (`npm run test:integration`) needs a Chrome path and several
# minutes, so it is not wired in here yet.

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Must match the base images in the two Dockerfiles: Go 1.26 for the backend,
  # Node 22 for the frontend. A floating patch release is intentional — the
  # standard-library advisories govulncheck reports are fixed by building with a
  # current patch, so pinning an old one would keep the findings.
  GO_VERSION: "1.26.x"
  NODE_VERSION: "22"

jobs:
  backend:
    name: Go build, vet and tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: backend/go.sum
      - name: Build
        run: go build ./...
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./...

  frontend:
    name: Frontend lint, types and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Build
        run: npm run build
      - name: Dependency audit (reporting)
        # Reported, not enforced, on purpose: every open advisory is in Next.js
        # tooling and the only fix today is `npm install next@16.3.6`, which is
        # outside the pinned range. DEPLOYMENT.md records why each finding is not
        # reachable in this deployment and TODO.md tracks the framework bump, so
        # the numbers stay visible without a red pipeline that hides real breaks.
        continue-on-error: true
        run: npm audit --audit-level=high

  vulnerabilities:
    name: govulncheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: backend/go.sum
      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - name: Scan
        # Fails only on a vulnerability the code actually reaches; packages that
        # are imported but never called are listed and do not fail the job.
        run: govulncheck ./...

  containers:
    name: Docker Compose build
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Validate compose file
        run: docker compose config
      - name: Build both images
        run: docker compose build
