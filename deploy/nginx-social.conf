# ──────────────────────────────────────────────────────────────────────────
# Social Network — server blocks for the co-hosted deploy.
#
# This file is NOT served by our own container. It is dropped into beyond's
# reverse proxy, which is the single public entrypoint on this host:
#
#   cp deploy/nginx-social.conf ~/beyond/docker/nginx/sites/social.conf
#   docker exec beyond-nginx nginx -t          # must pass BEFORE reloading
#   docker exec beyond-nginx nginx -s reload
#
# `beyond-nginx` mounts docker/nginx/sites at /etc/nginx/sites (read-only) and
# beyond's nginx.conf ends with `include /etc/nginx/sites/*.conf;`, so a new file
# there is picked up by a reload with no edit to beyond's own config.
#
# Upstream: our frontend container, reached by its unique alias on the shared
# `beyond-prod` network (see compose.prod.yaml). The variable-based proxy_pass is
# deliberate — nginx re-resolves it per request through Docker's DNS, so a
# redeploy that gives the container a new IP cannot leave nginx proxying a stale
# address. A literal proxy_pass would freeze the IP at config-load time and 502.
#
# TLS uses beyond's existing Let's Encrypt cert, which must carry
# social.beyondedubh.com in its SANs — see DEPLOYMENT.md for the --expand step.
# ──────────────────────────────────────────────────────────────────────────

# Port 80 — ACME HTTP-01 challenge (for renewals) + HTTPS redirect.
server {
    listen 80;
    server_name social.beyondedubh.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# Port 443 — the app itself.
server {
    listen 443 ssl;
    server_name social.beyondedubh.com;

    ssl_certificate     /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # WebSocket: the frontend proxies /ws to the backend, so the upgrade headers
    # only need to survive this hop. Kept in its own location so ordinary requests
    # do not carry a bogus `Connection: upgrade`.
    location /ws {
        set $social_upstream http://social-network-frontend:4000;
        proxy_pass $social_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location / {
        set $social_upstream http://social-network-frontend:4000;
        proxy_pass $social_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Stream media uploads to the backend instead of buffering them here.
        proxy_request_buffering off;
        client_max_body_size 100m;
    }
}
