default:
  interruptible: true

stages:
  - checks
  - containers

variables:
  GOMODCACHE: $CI_PROJECT_DIR/.cache/go-mod
  GOCACHE: $CI_PROJECT_DIR/.cache/go-build

backend:
  stage: checks
  image: golang:1.26-bookworm@sha256:a688600ca24f8a4d3ca77f95b0dd40704a9fc787c826660eb7ba0b641b8b175d
  cache:
    key:
      files:
        - backend/go.sum
    paths:
      - .cache/
  script:
    - cd backend
    - go build ./...
    - go vet ./...
    - go test ./...

frontend:
  stage: checks
  image: node:22-bookworm@sha256:363e1587494626837fa7f9a23bdb453d13b0ff3c67c705c2805cfc69c2d2fad7
  cache:
    key:
      files:
        - frontend/package-lock.json
    paths:
      - frontend/.npm-cache/
  variables:
    BACKEND_URL: http://backend:5174
  script:
    - cd frontend
    - npm ci --cache .npm-cache --prefer-offline
    - npm run lint
    - npm run build
    - npx tsc --noEmit
    - npm audit --omit=dev --audit-level=high

govulncheck:
  stage: checks
  image: golang:1.26-bookworm@sha256:a688600ca24f8a4d3ca77f95b0dd40704a9fc787c826660eb7ba0b641b8b175d
  cache:
    key:
      files:
        - backend/go.sum
    paths:
      - .cache/
  script:
    - cd backend
    - go install golang.org/x/vuln/cmd/govulncheck@latest
    - $(go env GOPATH)/bin/govulncheck ./...

base-images:
  stage: checks
  image: node:22-bookworm@sha256:363e1587494626837fa7f9a23bdb453d13b0ff3c67c705c2805cfc69c2d2fad7
  allow_failure: true
  script:
    - node scripts/pin-base-images.mjs

browser:
  stage: checks
  image: golang:1.26-bookworm@sha256:a688600ca24f8a4d3ca77f95b0dd40704a9fc787c826660eb7ba0b641b8b175d
  when: manual
  allow_failure: true
  variables:
    CHROME_PATH: /usr/bin/chromium
  before_script:
    - apt-get update && apt-get install -y --no-install-recommends ca-certificates chromium curl gnupg
    - curl -fsSL https://deb.nodesource.com/setup_22.x | bash -
    - apt-get install -y --no-install-recommends nodejs
  script:
    - cd frontend
    - npm ci
    - npm run test:integration

containers:
  stage: containers
  needs:
    - backend
    - frontend
  image: docker:27@sha256:aa3df78ecf320f5fafdce71c659f1629e96e9de0968305fe1de670e0ca9176ce
  services:
    - docker:27-dind@sha256:aa3df78ecf320f5fafdce71c659f1629e96e9de0968305fe1de670e0ca9176ce
  variables:
    DOCKER_HOST: tcp://docker:2376
    DOCKER_TLS_CERTDIR: "/certs"
    DOCKER_TLS_VERIFY: 1
    DOCKER_CERT_PATH: "$DOCKER_TLS_CERTDIR/client"
  allow_failure: true
  script:
    - docker compose config
    - docker compose build
